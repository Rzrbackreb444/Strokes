kind = "web"
previewPath = "/"
title = "Stroke Lyfe"
version = "1.0.0"
id = "artifacts/stroke-lyfe"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22585

[services.development]
run = "pnpm --filter @workspace/stroke-lyfe run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stroke-lyfe", "run", "build" ]
publicDir = "artifacts/stroke-lyfe/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22585"
BASE_PATH = "/"
